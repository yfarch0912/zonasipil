<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" role="img" aria-label="Potongan balok beton bertulang: selimut beton, sengkang, tulangan tekan di atas dan tulangan tarik di bawah">
  <!-- ZonaSipil original: RC beam cross-section (conceptual).
       Cover respected, stirrup closed around longitudinal bars:
       2 bars top (compression zone), 3 bars bottom (tension zone). -->
  <rect x="60" y="30" width="220" height="280" rx="10" fill="#F4F3EE"/>
  <rect x="60" y="30" width="220" height="280" rx="10" fill="none" stroke="#252C30" stroke-width="2.5"/>
  <!-- stirrup -->
  <rect x="88" y="58" width="164" height="224" rx="16" fill="none" stroke="#168B83" stroke-width="6"/>
  <!-- longitudinal bars -->
  <g fill="#142D36">
    <circle cx="104" cy="74" r="10"/><circle cx="236" cy="74" r="10"/>
    <circle cx="104" cy="266" r="11"/><circle cx="170" cy="266" r="11"/><circle cx="236" cy="266" r="11"/>
  </g>
  <g fill="#E9A64B">
    <circle cx="104" cy="266" r="4"/><circle cx="170" cy="266" r="4"/><circle cx="236" cy="266" r="4"/>
  </g>
  <!-- leader lines + labels -->
  <g stroke="#899398" stroke-width="1.4">
    <path d="M252 74 h44 M262 266 h34 M170 296 v-14"/>
    <path d="M84 170 h-16"/>
  </g>
  <g font-family="Georgia, serif" font-size="14" fill="#252C30">
    <text x="302" y="70">tulangan atas</text>
    <text x="300" y="150" font-size="12" fill="#899398">(daerah tekan)</text>
    <text x="302" y="262">tulangan bawah</text>
    <text x="300" y="282" font-size="12" fill="#899398">(daerah tarik)</text>
    <text x="14" y="150" transform="rotate(-90 24 170)" text-anchor="middle">sengkang</text>
  </g>
  <!-- cover dimension -->
  <g stroke="#E9A64B" stroke-width="1.6">
    <path d="M60 326 h28 M74 320 v12 M88 320 v12"/>
  </g>
  <text x="98" y="331" font-family="Georgia, serif" font-size="13" fill="#252C30">selimut beton</text>
</svg>
